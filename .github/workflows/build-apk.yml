# Builds a debug APK for a pull request when the `build-apk` label is applied.
# The label is an explicit opt-in so PRs don't burn CI minutes on every push.
name: Build APK

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    if: github.event.label.name == 'build-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: foldfx-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
